name: Build SM-A175N Android 17 APK

on:
  push:
    branches:
      - feature/sm-a175n-android17-oneui9
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a175n-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 SDK
        run: sdkmanager --install "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble arm64 debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: InstallWithOptions-SM-A175N-Android17-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
