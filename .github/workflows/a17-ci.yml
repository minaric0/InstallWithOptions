name: Android 17 (SM-A175N) build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 17 SDK
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          ln -sfn android-37.0 "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/platforms/android-37"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: InstallWithOptions-A17-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
